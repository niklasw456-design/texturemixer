name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip texturemixer.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build
        working-directory: texturemixer
      - uses: actions/upload-artifact@v4
        with:
          name: texturemixer
          path: |
            texturemixer/build/libs/*.jar
            !texturemixer/build/libs/*-sources.jar
